[package]
name = "spotifast-stats-api"
version = "0.1.0"
edition = "2024"
description = "Multi-user stats.fm-like HTTP API tracking Spotify plays"
publish = false

[lib]
name = "spotifast_stats_api"
path = "src/lib.rs"

[[bin]]
name = "spotifast-stats-api"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"

[dev-dependencies]
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
