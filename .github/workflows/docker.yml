name: Docker

# Every branch push and pull request builds the image (that is how the
# Dockerfile gets tested: nothing is compiled locally). Only main and v* tags
# publish it to GHCR.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4

      # Image names must be lowercase; the owner may not be.
      - name: Compute image name
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/spotifast-stats-api" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=ref,event=pr

      # Build once into the local Docker daemon for the smoke test.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: spotifast-stats-api:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run the image as it would run in production (non-root, fresh /data
      # volume, dummy Spotify credentials) and wait for its HEALTHCHECK.
      - name: Smoke test the image
        run: |
          docker volume create smoke-data
          docker run -d --name smoke -v smoke-data:/data \
            -e SPOTIFY_CLIENT_ID=dummy -e SPOTIFY_CLIENT_SECRET=dummy \
            -e SPOTIFY_REDIRECT_URI=http://127.0.0.1:8080/auth/callback \
            -p 8080:8080 spotifast-stats-api:smoke
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            echo "health: $status"
            if [ "$status" = healthy ]; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != true ]; then break; fi
            sleep 3
          done
          docker logs smoke
          test "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy
          curl --fail --silent --show-error http://127.0.0.1:8080/health
          test "$(docker exec smoke id -u)" != 0
          docker exec smoke test -e /data/spotifast.db

      # Publish (main and v* tags only); layers come from the cache above.
      - uses: docker/build-push-action@v6
        if: env.PUBLISH == 'true'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
